name: Build & Release

on:
    push:
        branches: [main]

permissions:
    contents: write

jobs:
    build:
        if: "!contains(github.event.head_commit.message, '[skip ci]')"
        runs-on: windows-latest

        steps:
            - uses: actions/checkout@v4

            - name: Install Rust stable
              uses: dtolnay/rust-toolchain@stable

            - name: Rust cache
              uses: swatinem/rust-cache@v2
              with:
                  workspaces: src-tauri -> target

            - name: Install pnpm
              uses: pnpm/action-setup@v4
              with:
                  version: 10

            - name: Install Node.js
              uses: actions/setup-node@v4
              with:
                  node-version: 22
                  cache: pnpm

            - name: Bump patch version
              id: bump
              shell: bash
              run: |
                  VERSION=$(node scripts/bump.mjs patch)
                  echo "version=$VERSION" >> "$GITHUB_OUTPUT"

            - name: Commit version bump
              shell: bash
              run: |
                  git config user.name "github-actions[bot]"
                  git config user.email "github-actions[bot]@users.noreply.github.com"
                  git add src-tauri/tauri.conf.json package.json
                  git commit -m "chore: bump version to v${{ steps.bump.outputs.version }} [skip ci]"
                  git push

            - name: Install frontend dependencies
              run: pnpm install

            - name: Build Tauri app
              uses: tauri-apps/tauri-action@v0
              env:
                  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
              with:
                  tagName: v${{ steps.bump.outputs.version }}
                  releaseName: SGPA v${{ steps.bump.outputs.version }}
                  releaseBody: "Build automatique — télécharger le fichier `.msi` ou `.exe` ci-dessous."
                  releaseDraft: false
                  prerelease: false
